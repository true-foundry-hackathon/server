name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional release tag name for draft artifacts
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    environment: production
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VOX_SUPABASE_URL: ${{ vars.VOX_SUPABASE_URL }}
          VOX_SUPABASE_ANON_KEY: ${{ vars.VOX_SUPABASE_ANON_KEY }}
          VOX_API_URL: ${{ vars.VOX_API_URL }}
          VOX_BRIDGE_URL: ${{ vars.VOX_BRIDGE_URL }}
          VOX_OAUTH_REDIRECT_URI: ${{ vars.VOX_OAUTH_REDIRECT_URI }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || format('desktop-{0}', github.sha) }}
          releaseName: Vox Desktop ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || github.sha }}
          releaseBody: |
            Desktop voice client build (Apple Silicon).

            Google sign-in redirect (add in Supabase Auth URL config):
            `vox://auth/callback`
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin
