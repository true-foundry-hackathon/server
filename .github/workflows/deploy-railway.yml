name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Core API
        run: railway up --service "${{ secrets.RAILWAY_SERVICE_CORE_API || 'core-api' }}" --detach
        working-directory: core
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Core Worker
        run: railway up --service "${{ secrets.RAILWAY_SERVICE_CORE_WORKER || 'core-worker' }}" --dockerfile Dockerfile.worker --detach
        working-directory: core
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Bridge
        run: railway up --service "${{ secrets.RAILWAY_SERVICE_BRIDGE || 'bridge' }}" --detach
        working-directory: bridge
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Caddy
        run: railway up --service "${{ secrets.RAILWAY_SERVICE_CADDY || 'caddy' }}" --detach
        working-directory: caddy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
